name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  resource:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pip install maafw
      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          # 在 requirements.txt 中查找以 maafw 开头的行（例如: maafw==4.5.6 或 maafw>=4.5）
          line=$(grep -E '^\s*maafw' requirements.txt | head -n 1)
          if [ -n "$line" ]; then
            pkg=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          else
            pkg='maafw'
          fi
          echo "Installing $pkg"
          python -m pip install --upgrade $pkg

      - name: Check Resource
        run: |
          python ./tools/ci/check_resource.py ./assets/resource/base

      - name: Check Interface
        run: |
          npm ci
          npx @nekosu/maa-tools check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint with Ruff
        run: uv run --frozen ruff check .

      - name: Format check with Ruff
        run: uv run --frozen ruff format --check .

      - name: Type check with Pyright
        run: uv run --frozen pyright

      - name: Run tests with Pytest
        run: uv run --frozen pytest
